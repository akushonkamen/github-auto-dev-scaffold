# Composite action: Module 6 (test)
# PRD §2 module 6 — Codex out-of-distribution tester.
#
# SECURITY: triggered by `verified` label (Module 5 passed). Codex runs with
# permission-profile: workspace-write (S5). NEVER danger-full-access.
#
# REQUIRED PERMISSIONS (caller workflow must grant):
#   contents:        read        (read PR diff)
#   issues:          write       (post audit comment, apply labels)
#   pull-requests:   write       (post test report comment on PR)
#
# S1: NO contents:write. Test reads source and writes test files via Codex
# (workspace-write profile), but the action itself is read-only on source.
# S5: Codex permission-profile: workspace-write (NEVER danger-full-access).

name: "Module 6 — Test"
description: "Run tests via Codex (out-of-distribution tester per PRD §4), emit test report + label transition."

inputs:
  issue-number:
    description: "Issue number"
    required: true
  pr-url:
    description: "PR URL for audit comment traceability"
    required: true
  pr-number:
    description: "PR number for posting test report comment"
    required: true
  head-branch:
    description: "claude/issue-N-* branch to test"
    required: true
  base-branch:
    description: "Base branch (dev)"
    required: true
  repo-token:
    description: "GITHUB_TOKEN (read-only + PR comment + label)"
    required: true
  api-key:
    description: "OPENAI_API_KEY (Codex uses OpenAI, not Anthropic — PRD §4)"
    required: true
  engine:
    description: "LLM engine (codex). Default: codex (out-of-distribution tester per PRD §4)"
    required: false
    default: "codex"
  model:
    description: "Model ID override. Empty = gpt-5 default (vars.TEST_MODEL)."
    required: false
    default: ""
  max-turns:
    description: "Agent turn cap (PRD §5). Default: 10 (lower than develop — Codex is more expensive)"
    required: false
    default: "10"
  context-budget-paths:
    description: "Path allowlist — limit reads (PRD §5)"
    required: false
    default: ""

outputs:
  test-status:
    description: "Test result (passed | failed)"
    value: ${{ steps.emit.outputs.test-status }}
  test-report:
    description: "Maintainer-readable test report (max 2000 chars)"
    value: ${{ steps.emit.outputs.test-report }}
  commit-sha:
    description: "Head commit SHA that was tested"
    value: ${{ steps.emit.outputs.commit-sha }}

runs:
  using: composite
  steps:
    - name: Fetch issue context + PR diff
      id: context
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.repo-token }}
        NUMBER: ${{ inputs.issue-number }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -eu
        # Fetch issue title, body, labels
        json=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,url)
        title=$(printf '%s' "$json" | jq -r '.title')
        body=$(printf '%s' "$json"  | jq -r '.body // "(empty)"')
        url=$(printf '%s' "$json"   | jq -r '.url')
        {
          echo "title<<TITLE_EOF"
          printf '%s\n' "$title"
          echo "TITLE_EOF"
          echo "url=$url"
          echo "body<<BODY_EOF"
          printf '%s\n' "$body"
          echo "BODY_EOF"
        } >> "$GITHUB_OUTPUT"

        # Fetch PR diff (first 8000 lines — cap for context budget)
        diff=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>/dev/null | head -n 8000 || echo "(diff unavailable)")
        {
          echo "diff<<DIFF_EOF"
          printf '%s\n' "$diff"
          echo "DIFF_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build Codex config (sealed schema + permission-profile)
      id: cfg
      shell: bash
      env:
        MODEL_INPUT: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        CONTEXT_PATHS: ${{ inputs.context-budget-paths }}
      run: |
        set -eu
        model="${MODEL_INPUT:-gpt-5}"
        {
          echo "model=$model"
          echo "max-turns=$MAX_TURNS"
        } >> "$GITHUB_OUTPUT"

        # Sealed JSON output schema for Codex (matches prompt contract).
        # test_status: "passed" | "failed"
        # test_report: maintainer-readable, max 2000 chars
        # failures: list of specific tests that didn't pass (empty if passed)
        # tests_added: count of new test files Codex contributed
        schema=$(jq -c . <<'JSON'
        {
          "type": "object",
          "required": ["test_status", "test_report", "failures", "tests_added"],
          "properties": {
            "test_status": {"type": "string", "enum": ["passed", "failed"]},
            "test_report": {"type": "string", "maxLength": 2000},
            "failures": {"type": "array", "items": {"type": "string"}},
            "tests_added": {"type": "integer", "minimum": 0}
          },
          "additionalProperties": false
        }
        JSON
        )
        echo "schema='${schema}'" >> "$GITHUB_OUTPUT"

        if [ -n "$CONTEXT_PATHS" ]; then
          echo "context_paths=$CONTEXT_PATHS" >> "$GITHUB_OUTPUT"
        else
          echo "context_paths=" >> "$GITHUB_OUTPUT"
        fi

    - name: Run tests via Codex (PRD §4 out-of-distribution tester)
      if: inputs.engine == 'codex'
      id: codex-engine
      uses: openai/codex-action@v1
      with:
        openai_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.repo-token }}
        permission_profile: workspace-write
        prompt: |
          You are the test module of the GithubAutoDev pipeline (Module 6).

          Issue #${{ inputs.issue-number }}: ${{ steps.context.outputs.title }}
          URL: ${{ steps.context.outputs.url }}

          ## Issue body (acceptance criteria source)
          ${{ steps.context.outputs.body }}

          ## PR diff (implementation to test)
          ```diff
          ${{ steps.context.outputs.diff }}
          ```

          ## Task
          Run the existing test suite. If coverage gaps exist for the issue acceptance
          criteria, ADD tests. Do NOT modify non-test files. Report pass/fail per test.

          ## Hard rules
          1. Run existing tests first (npm test, pytest, cargo test, etc. — detect the project type).
          2. If acceptance criteria are not covered by existing tests, write new test files.
          3. Do NOT modify production/source files — only test files.
          4. Report each test's status (pass/fail) in the test_report.
          5. Never print tokens, API keys, or environment variable values (S4).
          6. MANDATORY: When finished, write the final JSON result to a file named `codex-test-output.json`
             in the workspace root. This file is the ONLY way the pipeline reads your results.
             If this file is missing, the pipeline treats the run as a failure.${{ steps.cfg.outputs.context_paths && format('
          7. Allowed paths: {0}', steps.cfg.outputs.context_paths) || '' }}

          ## Output — write this EXACT JSON to `codex-test-output.json`:
          {
            "test_status": "passed" | "failed",
            "test_report": "<maintainer-readable report, max 2000 chars>",
            "failures": ["<specific test that failed>", ...],
            "tests_added": <count of new test files added, 0 if none>
          }

          After completing all work, write the JSON result to the file `codex-test-output.json`
          in the workspace root.

    - name: Collect Codex structured output
      if: inputs.engine == 'codex'
      id: codex-run
      shell: bash
      run: |
        set -euo pipefail
        if [ -f codex-test-output.json ]; then
          raw=$(cat codex-test-output.json)
          if printf '%s' "$raw" | jq -e '
            (.test_status == "passed" or .test_status == "failed")
            and (.test_report | type == "string" and length <= 2000)
            and (.failures | type == "array")
            and (.tests_added | type == "number" and . >= 0)
          ' >/dev/null 2>&1; then
            echo "codex-output=${raw}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Codex output file did not match the sealed {test_status, test_report, failures, tests_added} schema."
            echo 'codex-output={"test_status":"failed","test_report":"Codex output schema mismatch — see workflow run logs.","failures":["Schema validation failed"],"tests_added":0}' >> "$GITHUB_OUTPUT"
          fi
        else
          echo "::error::Codex did not produce codex-test-output.json — the test module cannot proceed. Run logs should be inspected for engine errors."
          echo 'codex-output={"test_status":"failed","test_report":"Codex engine did not produce structured output (codex-test-output.json missing). Manual test run required.","failures":["Codex output file missing"],"tests_added":0}' >> "$GITHUB_OUTPUT"
        fi

    - name: Parse engine output
      id: emit
      shell: bash
      env:
        CODEX_OUTPUT: ${{ steps.codex-run.outputs.codex-output }}
      run: |
        set -euo pipefail
        sha=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        raw="${CODEX_OUTPUT:-}"

        if [ -z "$raw" ]; then
          echo "::warning::Codex output is empty — engine may have failed or timed out."
          {
            echo "test-status=failed"
            echo "test-report=(engine did not emit structured output; inspect run logs)"
            echo "commit-sha=$sha"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Validate against sealed schema
        if ! printf '%s' "$raw" | jq -e '
          (.test_status == "passed" or .test_status == "failed")
          and (.test_report | type == "string" and length <= 2000)
          and (.failures | type == "array")
          and (.tests_added | type == "number" and . >= 0)
        ' >/dev/null 2>&1; then
          echo "::error::Engine output did not match the {test_status, test_report, failures, tests_added} schema."
          echo "Raw output (first 500 chars):"
          printf '%s' "$raw" | head -c 500 | sed 's/^/  raw> /'
          {
            echo "test-status=failed"
            echo "test-report=(engine output schema mismatch; inspect run logs)"
            echo "commit-sha=$sha"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        test_status="$(printf '%s' "$raw" | jq -r '.test_status')"
        test_report="$(printf '%s' "$raw" | jq -r '.test_report')"
        tests_added="$(printf '%s' "$raw" | jq -r '.tests_added')"

        echo "test-status=$test_status" >> "$GITHUB_OUTPUT"
        echo "tests-added=$tests_added" >> "$GITHUB_OUTPUT"
        echo "commit-sha=$sha" >> "$GITHUB_OUTPUT"
        {
          echo "test-report<<TEST_REPORT_EOF"
          printf '%s\n' "$test_report"
          echo "TEST_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"
