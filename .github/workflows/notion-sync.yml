# Notion Sync — module summary → Notion page append
#
# Triggers when any module workflow completes successfully.
# Extracts the issue number from the triggering workflow's head_branch
# and downloads the module-summary artifact to append to the
# corresponding Notion database page.
#
# SECURITY POSTURE (PRD §7):
#   permissions: contents:read + actions:read
#   (S1: NO contents:write — this workflow only reads artifacts and
#    calls the Notion API; it never touches source code.)
#   S4: NOTION_TOKEN is passed as a secret, never printed.
#
# Sub-bug fixes per Issue #39:
#   1. Issue number extracted from workflow_run.head_branch and passed
#      as explicit input (was undefined → Notion API reject).
#   2. Artifact prefix match handled in composite action (was exact match).
#   3. Artifact unzip handled by gh run download (was base64 of zip bytes).

name: notion-sync

on:
  workflow_run:
    workflows:
      - triage-issue
      - develop
      - self-verify
      - test
      - pr-open
      - review
      - judge
      - clarify-loop
      - merge-queue
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: notion-sync-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sync-module-summary:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Sub-bug 1 fix: extract issue number from the triggering workflow's
      # head_branch (e.g. claude/issue-39-bug-module-summaries → 39).
      - name: Resolve issue number from head branch
        id: issue
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          issue_number=$(echo "$HEAD_BRANCH" | grep -oP 'claude/issue-\K\d+' || echo "")
          if [ -z "$issue_number" ]; then
            echo "::warning::Could not extract issue number from head_branch: $HEAD_BRANCH"
          else
            echo "Resolved issue number: $issue_number (from branch $HEAD_BRANCH)"
          fi
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Sync module summary to Notion
        uses: ./.github/actions/notion-sync
        with:
          notion_token: ${{ secrets.NOTION_TOKEN }}
          notion_db_id: ${{ vars.NOTION_DB_ID }}
          event_type: module_summary
          issue_number: ${{ steps.issue.outputs.issue-number }}
          source_run_id: ${{ github.event.workflow_run.id }}
          repo: ${{ github.repository }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          head_branch: ${{ github.event.workflow_run.head_branch }}
