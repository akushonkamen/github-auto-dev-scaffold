# Module 4 — Develop (v2)
#
# Triggers when an issue gets `accepted` (maintainer path) OR `accepted-by-claude`
# (Claude self-acceptance from clarify loop, plan §7 S2 amendment).
# Creates a `claude/issue-N-<slug>` branch, calls the develop composite action,
# pushes the branch with CLAUDE_DEV_PAT, opens a PR with CLAUDE_DEV_PAT
# (PR opener = PAT owner so the PR is "from a real developer").
#
# SECURITY POSTURE (PRD §7 + plan §7):
#   - permissions: contents:write + issues:write + pull-requests:write
#     (Module 4 is the ONLY module allowed contents:write per S1)
#   - All pushes and PR opens use CLAUDE_DEV_PAT
#   - claude --disallowedTools blocks git push --force* and main/master checkout wholesale
#   - Base branch is hardcoded to `dev` (or repo var DEV_BASE_BRANCH); never main
#   - On failure: stage:failed label + failure comment, no main impact
#
# Triggers:
#   - issues.labeled with label == accepted OR accepted-by-claude (AC-V2-12)

name: develop

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: develop-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.label.name == 'accepted' || github.event.label.name == 'accepted-by-claude' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      head-branch: ${{ steps.branch.outputs.head-branch }}
      base-branch: ${{ steps.branch.outputs.base-branch }}
      issue-language: ${{ steps.lang.outputs.issue-language }}
    steps:
      - name: Gate — issue open + no maintainer-block label
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          should_run="true"
          reason=""
          json=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)
          state=$(printf '%s' "$json" | jq -r '.state')
          labels=$(printf '%s' "$json" | jq -r '.labels | map(.name) | join(",")')
          if [ "$state" != "OPEN" ]; then
            should_run="false"; reason="issue state=$state (not OPEN)"
          fi
          for forbidden in rejected force-manual; do
            if printf ',%s,' "$labels" | grep -q ",$forbidden,"; then
              should_run="false"; reason="maintainer override label present: $forbidden"
            fi
          done
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Preflight gate: should-run=$should_run reason=$reason"

      - name: Compute branch names
        id: branch
        if: steps.gate.outputs.should-run == 'true'
        env:
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          DEV_BASE: ${{ vars.DEV_BASE_BRANCH }}
        run: |
          set -eu
          base="${DEV_BASE:-dev}"
          # Slugify the title: lowercase, replace non-alnum with -, trim, cap length.
          slug=$(printf '%s' "$TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c '[:alnum:]' '-' \
            | tr -s '-' \
            | sed 's/^-//; s/-$//' \
            | cut -c1-40)
          if [ -z "$slug" ]; then slug="issue"; fi
          head="claude/issue-${NUMBER}-${slug}"
          echo "base-branch=$base" >> "$GITHUB_OUTPUT"
          echo "head-branch=$head" >> "$GITHUB_OUTPUT"

      - name: Detect issue language
        id: lang
        if: steps.gate.outputs.should-run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          body=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body | jq -r '.body // ""')
          total=$(printf '%s' "$body" | tr -d '[:space:]' | wc -m | tr -d ' ')
          cjk=$(printf '%s' "$body" | grep -oE $'[\xe4-\xe9][\x80-\xbf][\x80-\xbf]' | wc -l | tr -d ' ') || cjk=0
          lang="en"
          if [ "$total" -gt 0 ] && [ "$cjk" -gt 0 ]; then
            ratio=$((cjk * 100 / total))
            if [ "$ratio" -ge 30 ]; then lang="zh"; fi
          fi
          echo "issue-language=$lang" >> "$GITHUB_OUTPUT"

  develop:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: ${{ fromJSON(vars.DEVELOP_TIME_BUDGET_MIN || '60') }}
    outputs:
      branch-name: ${{ steps.branch.outputs.branch-name }}
      commit-sha: ${{ steps.develop.outputs.commit-sha }}
      pr-url: ${{ steps.pr.outputs.pr-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # S7 pipeline-fix (2026-07-07): persist-credentials=true + token=CLAUDE_DEV_PAT
          # was insufficient — actions/checkout's credential helper does not pass
          # the classic PAT's `workflow` scope header, so pushes touching
          # .github/workflows/* were rejected with "refusing to allow a GitHub App
          # to create or update workflow without workflows permission".
          # Fix: set persist-credentials=false here, and embed the PAT directly
          # in the git remote URL via extraheader in the push step below. That
          # makes the PAT's `workflow` scope actually authenticate.
          persist-credentials: false
          token: ${{ secrets.CLAUDE_DEV_PAT }}

      - name: Create head branch (off base, never main)
        id: branch
        env:
          BASE: ${{ needs.preflight.outputs.base-branch }}
          HEAD: ${{ needs.preflight.outputs.head-branch }}
        run: |
          set -euo pipefail
          # Try to check out base branch (origin/$BASE); fall back to default branch
          # but NEVER main (S3 guard).
          if [ "$BASE" = "main" ] || [ "$BASE" = "master" ]; then
            echo "::error::Refusing to develop against $BASE (PRD §7 S3)"
            exit 1
          fi
          # Retry-awareness (issue #51): if the remote head branch already exists
          # (e.g. test:retry-N re-triggered Module 4 via the #49 auto-retry path),
          # check out its tip so the new commit fast-forwards cleanly. Without
          # this, retry regenerates the commit from base and `git push` is
          # rejected as non-fast-forward.
          if git ls-remote --exit-code --heads origin "$HEAD" >/dev/null 2>&1; then
            echo "Remote branch $HEAD exists — checking out tip (likely retry scenario)"
            git fetch origin "$HEAD" --depth=1
            git checkout -B "$HEAD" "origin/$HEAD"
          elif git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            git checkout -B "$HEAD" "origin/$BASE"
          else
            # Base branch doesn't exist yet; use the repo default but keep the S3 guard.
            default=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
            if [ "$default" = "main" ] || [ "$default" = "master" ]; then
              echo "::error::Repo default branch is $default and DEV_BASE_BRANCH ($BASE) does not exist. Set DEV_BASE_BRANCH to a non-main ref."
              exit 1
            fi
            git checkout -B "$HEAD" "origin/$default"
          fi
          echo "branch-name=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Read prior Module 6 test report (retry path)
        id: retry-ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          # Check if this is a retry (test:retry-N label present).
          labels=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels | map(.name) | join(",")')
          retry_label=$(printf '%s' "$labels" | grep -o 'test:retry-[0-9]' || echo "")

          if [ -n "$retry_label" ]; then
            # Get the most recent Module 6 test report from issue comments.
            # Module 6 comments have "**Test:" marker in the body.
            prior=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '[.comments[] | select(.body | test("\\*\\*Test:"))] | last | .body' 2>/dev/null || echo "")
            echo "has-retry=true" >> "$GITHUB_OUTPUT"
            echo "retry-label=$retry_label" >> "$GITHUB_OUTPUT"
            {
              echo "prior-report<<PRIOR_EOF"
              printf '%s\n' "$prior"
              echo "PRIOR_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Retry detected: $retry_label, prior report length=$(printf '%s' "$prior" | wc -c)"
          else
            echo "has-retry=false" >> "$GITHUB_OUTPUT"
            echo "prior-report=" >> "$GITHUB_OUTPUT"
            echo "Not a retry — proceeding with normal develop flow."
          fi

      - name: Run develop composite
        id: develop
        uses: ./.github/actions/develop
        with:
          issue-number: ${{ github.event.issue.number }}
          base-branch: ${{ needs.preflight.outputs.base-branch }}
          head-branch: ${{ needs.preflight.outputs.head-branch }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}
          model: ${{ vars.DEVELOP_MODEL }}
          max-turns: ${{ vars.DEVELOP_MAX_TURNS || '20' }}
          context-budget-paths: ${{ vars.DEVELOP_CONTEXT_PATHS || '' }}
          issue-language: ${{ needs.preflight.outputs.issue-language }}
          prior-test-report: ${{ steps.retry-ctx.outputs.prior-report }}

      - name: Push branch + open PR (CLAUDE_DEV_PAT)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          CLAUDE_DEV_PAT: ${{ secrets.CLAUDE_DEV_PAT }}
          HEAD: ${{ steps.branch.outputs.branch-name }}
          SHA: ${{ steps.develop.outputs.commit-sha }}
          SUMMARY: ${{ steps.develop.outputs.summary }}
          PR_TITLE: ${{ github.event.issue.title }}
          HAS_RETRY: ${{ steps.retry-ctx.outputs.has-retry }}
          RETRY_LABEL: ${{ steps.retry-ctx.outputs.retry-label }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # S7 pipeline-fix (2026-07-07): embed PAT in extraheader so the classic
          # PAT's `workflow` scope authenticates the push. actions/checkout's
          # credential helper does not pass the scope header reliably.
          git config --local --unset http.https://github.com/.extraheader 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "Authorization: basic $(printf 'x-access-token:%s' "$CLAUDE_DEV_PAT" | base64)"
          # Push the head branch (no force — claude was blocked from force-push anyway).
          # Capture stderr to detect "Everything up-to-date" (issue #57).
          push_out=$(git push origin "$HEAD" 2>&1)

          # ── Retry no-op detection (issue #57) ──
          # When a retry produces no new commits (push says "Everything up-to-date"),
          # the pipeline stalls because downstream modules fire on push/pull_request
          # events only. Detect this and escalate explicitly so the issue does not
          # sit at in-development indefinitely.
          NOOP="false"
          if echo "$push_out" | grep -q "Everything up-to-date"; then
            if [ "$HAS_RETRY" = "true" ]; then
              NOOP="true"
              echo "::warning::Retry no-op: push was up-to-date. Claude made no new commits on retry attempt ${RETRY_LABEL:-unknown}. Escalating to maintainer."
              gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "stage:failed" --add-label "retry-noop"
              gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "in-development" 2>/dev/null || true
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "⚠️ **Retry no-op detected** — \`git push\` reported \`Everything up-to-date\` on retry attempt \`${RETRY_LABEL:-unknown}\`. Claude made no new commits because the existing implementation already satisfies the issue requirements or the changes were inconsequential.

          The existing PR remains open and contains the implementation. **Escalating to maintainer** for manual review.

          _Automatic escalation to prevent silent pipeline stalls (issue #57). No downstream modules triggered._"
            else
              echo "Push up-to-date but not a retry — proceeding with existing PR."
            fi
          fi
          echo "retry-noop=$NOOP" >> "$GITHUB_OUTPUT"

          # Build PR body with disclosure preamble + change summary + test plan stub.
          body=$(cat <<EOF
          I'm an AI assistant (powered by Claude) operating under the GithubAutoDev disclosure policy.

          ## Summary
          $SUMMARY

          ## Issue
          Closes #${{ github.event.issue.number }}

          ## Test plan
          - [ ] CI green
          - [ ] Reviewer verifies scope matches issue acceptance criteria
          - [ ] No regressions in adjacent modules

          _Branch: \`$HEAD\` @ \`${SHA:0:12}\`_
          EOF
          )
          # Idempotent PR open (issue #54): on retry the PR already exists.
          # Look up an open PR for this head/base pair first; create only if missing.
          BASE_REF="${{ needs.preflight.outputs.base-branch }}"
          pr_url=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD" --base "$BASE_REF" --state open \
            --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_REF" \
              --head "$HEAD" \
              --title "[Issue #${{ github.event.issue.number }}] ${PR_TITLE}" \
              --body "$body")
            echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"
            if [ "$NOOP" = "true" ]; then
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "⚠️ **Retry no-op**: No new commits landed on \`$HEAD\`. See escalation comment above."
            else
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "🚀 Development branch pushed: \`$HEAD\` @ \`${SHA:0:12}\`. PR: $pr_url"
            fi
          else
            echo "Reusing existing PR: $pr_url"
            echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"
            if [ "$NOOP" = "true" ]; then
              gh pr comment "$pr_url" --repo "$GITHUB_REPOSITORY" \
                --body "⚠️ **Retry no-op**: This retry produced no new commits (\`Everything up-to-date\`). See issue #$NUMBER for escalation details."
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "⚠️ **Retry no-op**: No new commits landed on \`$HEAD\`. Existing PR: $pr_url"
            else
              gh pr comment "$pr_url" --repo "$GITHUB_REPOSITORY" \
                --body "🔄 **Retry attempt** — new push: \`$HEAD\` @ \`${SHA:0:12}\`."
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "🔄 Retry push landed on existing PR: \`$HEAD\` @ \`${SHA:0:12}\`. PR: $pr_url"
            fi
          fi

      - name: Transition issue label (accepted → in-development)
        if: steps.pr.outputs.retry-noop != 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          # Remove accepted-by-claude (clarify loop terminal marker) and accepted (maintainer)
          # — both are valid Module 4 entry signals but neither should persist past this point.
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "accepted-by-claude" 2>/dev/null || true
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "accepted" 2>/dev/null || true
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "in-development"

  on-failure:
    needs: [preflight, develop]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.develop.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark stage:failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::warning::No issue number on this event."
            exit 0
          fi
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "stage:failed" || true
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Develop failed. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. A maintainer will triage manually." || true
