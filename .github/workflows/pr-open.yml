# Module 7 — PR open (Claude engine)
#
# Triggers when `tested` label is applied to an issue (Module 6 test passed).
# Locates the existing PR opened by Module 4 develop, posts a ready-for-review
# comment, applies `in-review` label to the PR, and posts an audit comment on
# the issue.
#
# SECURITY POSTURE (PRD §7):
#   - permissions: contents:read + issues:write + pull-requests:write
#     (S1: NO contents:write — PR open is read + PR comment + label only)
#   - S5: claude --allowedTools whitelist (Read, Grep, Glob, Bash(gh pr:*))
#   - S4: no secrets printed in workflow
#   - S3: never writes to main
#   - PR #16 lesson: label writes use CLAUDE_DEV_PAT (so Module 8 review fires)
#   - On failure: stage:failed label + failure comment
#
# Triggers:
#   - issues.labeled with label == tested

name: pr-open

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-open-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.label.name == 'tested' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Gate — issue open + no maintainer-block label
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          should_run="true"
          reason=""
          json=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)
          state=$(printf '%s' "$json" | jq -r '.state')
          labels=$(printf '%s' "$json" | jq -r '.labels | map(.name) | join(",")')
          if [ "$state" != "OPEN" ]; then
            should_run="false"; reason="issue state=$state (not OPEN)"
          fi
          for forbidden in rejected force-manual; do
            if printf ',%s,' "$labels" | grep -q ",$forbidden,"; then
              should_run="false"; reason="maintainer override label present: $forbidden"
            fi
          done
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Preflight gate: should-run=$should_run reason=$reason"

  pr-open:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: ${{ fromJSON(vars.PR_OPEN_TIME_BUDGET_MIN || '15') }}
    outputs:
      stage: ${{ steps.composite.outputs.stage }}
      audit-comment-url: ${{ steps.composite.outputs.audit-comment-url }}
      pr-url: ${{ steps.composite.outputs.pr-url }}
      pr-number: ${{ steps.composite.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover PR from issue audit comments
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Search issue comments for "PR:" link posted by develop workflow.
          # develop posts "🚀 Development branch pushed... PR: <url>"
          pr_url=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '.comments | map(.body) | join("\n")' \
            | grep -oE 'https://github\.com/[^/]+/[^/]+/pull/[0-9]+' \
            | head -n 1 || echo "")

          if [ -z "$pr_url" ]; then
            echo "::error::Could not find PR URL in issue #$NUMBER comments. Has develop (Module 4) run?"
            exit 1
          fi

          pr_number=$(printf '%s' "$pr_url" | grep -oE '[0-9]+$' || echo "")
          if [ -z "$pr_number" ]; then
            echo "::error::Could not extract PR number from URL: $pr_url"
            exit 1
          fi

          # Discover head branch from PR
          head_branch=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
          base_branch=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName' 2>/dev/null || echo "dev")

          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head-branch=$head_branch" >> "$GITHUB_OUTPUT"
          echo "base-branch=$base_branch" >> "$GITHUB_OUTPUT"

          echo "Discovered PR: $pr_url (head=$head_branch, base=$base_branch)"

      - name: Run pr-open composite (Claude engine)
        id: composite
        uses: ./.github/actions/pr-open
        with:
          branch-name: ${{ steps.pr.outputs.head-branch }}
          issue-number: ${{ github.event.issue.number }}
          pr-number: ${{ steps.pr.outputs.pr-number }}
          pr-url: ${{ steps.pr.outputs.pr-url }}
          workflow-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # PR #16 lesson: pass CLAUDE_DEV_PAT so gh pr edit --add-label in-review
          # triggers downstream workflows (Module 8 review).
          repo-token: ${{ secrets.CLAUDE_DEV_PAT }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}
          model: ${{ vars.PR_OPEN_MODEL }}
          max-turns: ${{ vars.PR_OPEN_MAX_TURNS || '8' }}
          context-budget-paths: ${{ vars.PR_OPEN_CONTEXT_PATHS || '' }}

      - name: Post audit comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          STAGE: ${{ steps.composite.outputs.stage }}
          PR_URL: ${{ steps.composite.outputs.pr-url }}
          PR_NUMBER: ${{ steps.composite.outputs.pr-number }}
          COMMENT_URL: ${{ steps.composite.outputs.audit-comment-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<AUDIT_EOF
          📬 **PR open: \`$STAGE\`**

          | Field | Value |
          |---|---|
          | PR | $PR_URL |
          | Workflow run | $RUN_URL |

          The PR has been marked ready for review.  A maintainer will review
          and approve (PRD §6 human-in-the-loop).

          Next: Module 8 (AI review) triggers on PR labeled \`in-review\`.
          AUDIT_EOF
          )"

  on-failure:
    needs: [preflight, pr-open]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.pr-open.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark stage:failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::warning::No issue number on this event."
            exit 0
          fi
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "stage:failed" || true
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ PR open failed. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. A maintainer will triage manually." || true
