name: 'Notion Sync'
description: 'Sync GitHub Issues to Notion database with idempotency guarantees'

inputs:
  issue_number:
    description: 'GitHub Issue number (for issue events)'
    required: false
  event_type:
    description: 'Event type: opened, labeled, unlabeled, module_summary, module_summary_push_fallback'
    required: true
  source_run_id:
    description: 'Workflow run ID (for workflow_run events)'
    required: false
  branch:
    description: 'Branch name (for push fallback events)'
    required: false
  commit_sha:
    description: 'Commit SHA (for push fallback events)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }} && npm ci --production

    # AC2: Layered failure resilience - sync.mjs handles Notion API failures gracefully
    # On failure, sync.mjs posts audit comment with "notion sync failed:" prefix and exits 0
    - name: Run sync
      shell: bash
      continue-on-error: true
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        EVENT_TYPE: ${{ inputs.event_type }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        BRANCH: ${{ inputs.branch }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        NOTION_API_KEY: ${{ env.NOTION_API_KEY }}
        NOTION_DATABASE_ID: ${{ env.NOTION_DATABASE_ID }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
      run: |
        cd ${{ github.action_path }} && node sync.mjs
