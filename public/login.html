<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.875rem; }
    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .sign-in-btn {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.625rem;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .sign-in-btn:hover { background: #0056cc; }
    .sign-in-btn:active { background: #004499; }
    #error-message {
      color: #d32f2f;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Sign In</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <!--
        FIX (Issue #6): Use <button type="submit"> instead of <div onclick="...">.
        Safari 18.2 does not fire click events reliably on non-interactive elements
        (div, span) that lack role="button", tabindex, and keyboard handlers.
        A native <button> element has correct implicit ARIA semantics and works
        across all browsers including Safari 18.2.
      -->
      <button type="submit" class="sign-in-btn">Sign In</button>

      <p id="error-message"></p>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error-message');

      if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password.';
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      // Navigate to dashboard on successful login
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
