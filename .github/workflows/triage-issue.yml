# Triage Issue — minimal viable Issue → Claude → Reply/Work loop.
#
# Listens for new issues, dispatches claude (or GLM via base-url passthrough)
# to analyze the issue body, then posts claude's comment verbatim. Optionally
# auto-applies the `accepted` label when claude's decision is "work" AND the
# repo variable AUTO_ACCEPT_ENABLED is "true" (PRD §7 S2 — maintainer opt-in).
#
# SECURITY (PRD §7 S1): this workflow consumes untrusted Issue body content.
#   permissions:
#     contents: read        # only reads CLAUDE.md / prompts
#     issues:   write       # posts comment, applies triage/accepted labels
#   NEVER add `contents: write`. A prompt-injection in an Issue body must not
#   escalate to repo writes.
#
# Engine: claude-code-action@v1 with ANTHROPIC_BASE_URL passthrough.
#   - Set DEEPSEEK_API_KEY + base url vars → routes to DeepSeek's Anthropic-compatible
#     endpoint (https://api.deepseek.com/anthropic) with model "deepseek-v4-pro".
name: triage-issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number to triage (manual test)"
        required: true
        type: string

# Default least-privilege. Each job repeats these explicitly so any single
# job's security posture can be read in isolation.
permissions:
  contents: read
  issues: write

# Single in-flight run per issue — duplicate triggers queue, don't clobber.
concurrency:
  group: triage-issue-${{ github.event.issue.number || github.event.inputs.issue-number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      decision: ${{ steps.triage.outputs.decision }}
      comment-body: ${{ steps.triage.outputs.comment_body }}
      suggested-labels: ${{ steps.triage.outputs.suggested_labels }}
      confidence: ${{ steps.triage.outputs.confidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve issue number
        id: resolve-issue
        run: |
          num="${{ github.event.issue.number || github.event.inputs.issue-number }}"
          if [ -z "$num" ]; then
            echo "::error::No issue number (event=$GITHUB_EVENT_NAME)"
            exit 1
          fi
          echo "issue-number=$num" >> "$GITHUB_OUTPUT"

      # Composite action returns decision + comment_body + suggested_labels + confidence.
      # It does NOT post the comment — that's this workflow's job.
      - name: Run triage (claude / GLM via base-url passthrough)
        id: triage
        uses: ./.github/actions/triage
        with:
          issue-number: ${{ steps.resolve-issue.outputs.issue-number }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}
          model: ${{ vars.TRIAGE_MODEL }}
          engine: claude
          max-turns: 6

      # Post claude's comment verbatim. S1-safe: issues:write only.
      - name: Post triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.resolve-issue.outputs.issue-number }}
          COMMENT_BODY: ${{ steps.triage.outputs.comment_body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT_BODY" | gh issue comment "$NUMBER" --body-file -

      # Always apply the `triage` label so downstream modules know triage ran.
      - name: Apply triage label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.resolve-issue.outputs.issue-number }}
        run: gh issue edit "$NUMBER" --add-label triage

      # ─── Queue clarify loop (cloud → Module 3' clarify handoff, v2) ────────
      # AC-V2-1 (v2 plan §3 Step 2): route LOW-CONFIDENCE `work` decisions to
      # the v2 clarify loop instead of v1 ralph. HIGH-CONFIDENCE work is handled
      # below by auto-accept (AA on) or recommend-acceptance (AA off). REPLY
      # decisions never enter the clarify loop — they stay on the v1 path
      # (comment + triage label, end of pipeline).
      #
      # Low-confidence = (work with empty confidence) OR
      #                  (work with confidence < TRIAGE_RALPH_THRESHOLD).
      # Empty confidence on `work` is treated as low (safer to refine).
      #
      # v2 lifecycle note: `needs-ralph` is no longer emitted here. The only
      # emitter of `needs-ralph` after this change is the clarify-loop workflow's
      # max-rounds fallback (see .github/workflows/clarify-loop.yml).
      - name: Queue clarify loop
        id: queue-clarify
        if: ${{ steps.triage.outputs.decision == 'work' && (steps.triage.outputs.confidence == '' || fromJSON(steps.triage.outputs.confidence) < fromJSON(vars.TRIAGE_RALPH_THRESHOLD || '0.7')) }}
        env:
          # S7 pipeline-fix (2026-07-07): use CLAUDE_DEV_PAT so the
          # `issues.labeled` event actually triggers clarify-loop.yml.
          # GITHUB_TOKEN-sourced label events don't fire downstream workflows.
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ steps.resolve-issue.outputs.issue-number }}
        run: |
          gh issue edit "$NUMBER" --add-label needs-clarify
          gh issue comment "$NUMBER" --body "⏳ Claude needs more information — Module 3' clarify loop will engage and ask follow-up questions."

      # PRD §7 S2: only maintainers may apply `accepted`. AUTO_ACCEPT_ENABLED
      # is a repo variable (default unset = off). Set it to "true" to enable
      # full auto-accept when claude's decision is "work".
      # AC-C7: cloud auto-accept fires ONLY on high-confidence work — confidence
      # >= TRIAGE_RALPH_THRESHOLD (default 0.7). Low-confidence work goes to
      # ralph for deeper analysis instead of being auto-accepted. This avoids
      # the ambiguous "needs-ralph AND auto-accept" coexistence.
      - name: Auto-accept (S2 opt-in, high-confidence only)
        if: ${{ steps.triage.outputs.decision == 'work' && vars.AUTO_ACCEPT_ENABLED == 'true' && steps.triage.outputs.confidence != '' && fromJSON(steps.triage.outputs.confidence) >= fromJSON(vars.TRIAGE_RALPH_THRESHOLD || '0.7') }}
        env:
          # S7 pipeline-fix (2026-07-07): use CLAUDE_DEV_PAT so the
          # `issues.labeled` event actually triggers develop.yml.
          # GITHUB_TOKEN-sourced label events don't fire downstream workflows.
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ steps.resolve-issue.outputs.issue-number }}
        run: |
          gh issue edit "$NUMBER" --add-label accepted
          gh issue comment "$NUMBER" --body "🤖 Claude recommends acceptance (high-confidence). AUTO_ACCEPT_ENABLED=true → applied \`accepted\` label. Module 4 (develop) will pick this up."

      # Default "work" path: claude recommends but maintainer decides.
      # AC-C7 paired: fires when work was decided, auto-accept is off, AND
      # confidence is high (low-confidence work is already queued for ralph
      # above — we don't double-comment).
      - name: Recommend acceptance (default)
        if: ${{ steps.triage.outputs.decision == 'work' && vars.AUTO_ACCEPT_ENABLED != 'true' && steps.triage.outputs.confidence != '' && fromJSON(steps.triage.outputs.confidence) >= fromJSON(vars.TRIAGE_RALPH_THRESHOLD || '0.7') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.resolve-issue.outputs.issue-number }}
          CONFIDENCE: ${{ steps.triage.outputs.confidence }}
        run: |
          gh issue comment "$NUMBER" --body "📊 Claude recommends entering development (confidence: ${CONFIDENCE}). Maintainer review required — apply \`accepted\` to proceed, or \`rejected\` to close."

      # ─── Module summary artifact (Module 10 Notion mirror) ──────────────
      - name: Emit module-summary artifact
        if: always()
        env:
          DECISION: ${{ steps.triage.outputs.decision }}
          CONFIDENCE: ${{ steps.triage.outputs.confidence }}
        run: |
          set -eu
          mkdir -p /tmp/module-summary
          jq -nc \
            --arg module triage \
            --arg status "$DECISION" \
            --arg confidence "$CONFIDENCE" \
            '{module: $module, status: $status, confidence: $confidence}' \
            > /tmp/module-summary/summary.json

      - name: Upload module-summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-summary-triage
          path: /tmp/module-summary/summary.json
          retention-days: 7

  # Failure path: post a stage:failed comment and label, do not block other issues.
  # PRD §6 graceful degradation.
  on-failure:
    needs: triage
    if: ${{ always() && needs.triage.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark stage:failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.issue-number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::warning::Cannot post stage:failed — no issue number on this event."
            exit 0
          fi
          gh issue edit "$NUMBER" --add-label "stage:failed" || true
          gh issue comment "$NUMBER" --body "⚠️ Triage failed. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. A maintainer will triage manually." || true
