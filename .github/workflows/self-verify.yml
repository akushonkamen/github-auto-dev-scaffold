# Module 5 — Self-verify (v2)
#
# Triggers when a PR targeting dev is opened or synchronized, and the head ref
# matches claude/issue-* (i.e., a PR opened by Module 4 develop).
# Runs the self-verify composite action to check the implementation against
# the issue acceptance criteria, then applies label transitions and posts
# an audit comment.
#
# SECURITY POSTURE (PRD §7):
#   - permissions: contents:read + issues:write + pull-requests:write
#     (S1: NO contents:write — verify is read-only)
#   - S5: claude --allowedTools whitelist (Read, Grep, Glob — no Bash, no Write)
#   - S4: no secrets printed in workflow; CLAUDE_DEV_PAT used ONLY for
#     label writes that need to trigger downstream workflows (PR #16 lesson)
#   - S3: never writes to main
#   - On failure: verify:failed label + failure comment, stage:failed fallback
#
# Triggers:
#   - pull_request targeting dev with head ref matching claude/issue-*

name: self-verify

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: self-verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  self-verify:
    if: ${{ startsWith(github.head_ref, 'claude/issue-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: ${{ fromJSON(vars.SELF_VERIFY_TIME_BUDGET_MIN || '30') }}
    outputs:
      verify-status: ${{ steps.verify.outputs.verify-status }}
      verify-report: ${{ steps.verify.outputs.verify-report }}
      commit-sha: ${{ steps.verify.outputs.commit-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Extract issue number from head ref
        id: issue
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          number=$(printf '%s' "$HEAD_REF" | sed -nE 's|^claude/issue-([0-9]+)-.*|\1|p')
          if [ -z "$number" ]; then
            echo "::error::Could not extract issue number from head ref: $HEAD_REF"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Apply verifying label on issue
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "verifying" || true

      - name: Run self-verify composite
        id: verify
        uses: ./.github/actions/self-verify
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          head-branch: ${{ github.head_ref }}
          base-branch: ${{ github.base_ref }}
          pr-url: ${{ github.event.pull_request.html_url }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}
          model: ${{ vars.SELF_VERIFY_MODEL }}
          max-turns: ${{ vars.SELF_VERIFY_MAX_TURNS || '10' }}
          context-budget-paths: ${{ vars.SELF_VERIFY_CONTEXT_PATHS || '' }}
          issue-language: "en"

      - name: Post audit comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
          STATUS: ${{ steps.verify.outputs.verify-status }}
          REPORT: ${{ steps.verify.outputs.verify-report }}
          SHA: ${{ steps.verify.outputs.commit-sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          icon="✅"
          if [ "$STATUS" = "failed" ]; then icon="❌"; fi

          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<AUDIT_EOF
          $icon **Self-verify: \`$STATUS\`**

          | Field | Value |
          |---|---|
          | PR | $PR_URL |
          | Commit | \`${SHA:0:12}\` |
          | Workflow run | $RUN_URL |

          ## Verify report

          $REPORT
          AUDIT_EOF
          )"

      - name: Transition labels (passed → verified)
        if: steps.verify.outputs.verify-status == 'passed'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "verifying" || true
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "verified"

      - name: Transition labels (failed → verify:failed)
        if: steps.verify.outputs.verify-status == 'failed'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_DEV_PAT }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "verifying" || true
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "verify:failed"

      - name: Comment failure details on PR (verify:failed)
        if: steps.verify.outputs.verify-status == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.verify.outputs.verify-report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "$(cat <<PR_BODY
          ❌ **Self-verify failed**

          The implementation does not meet all acceptance criteria. See the verify report below.

          ## Failures

          $REPORT

          ---
          [Workflow run]($RUN_URL) | Triggered by self-verify (Module 5)
          PR_BODY
          )"

      - name: Emit module summary
        if: always()
        run: |
          set +e
          mkdir -p ./.notion-out
          ISSUE_NUM="${{ steps.issue.outputs.number }}"
          STATUS="${{ steps.verify.outputs.verify-status }}"
          REPORT="${{ steps.verify.outputs.verify-report }}"
          SUMMARY="Self-verify status: $STATUS. Report: $REPORT"
          ESCAPED_SUMMARY=$(printf '%s' "$SUMMARY" | jq -Rs .)
          cat > ./.notion-out/module-summary.json <<EOF
          { "module_name": "self-verify", "issue_number": "$ISSUE_NUM", "summary": $ESCAPED_SUMMARY, "github_url": "${{ github.event.pull_request.html_url }}", "run_id": "${{ github.run_id }}", "timestamp": "$(date -u +%FT%TZ)" }
          EOF
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: module-summary-self-verify-${{ github.run_id }}
          path: ./.notion-out/module-summary.json

  on-failure:
    needs: self-verify
    if: ${{ always() && needs.self-verify.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract issue number
        id: issue
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          number=$(printf '%s' "$HEAD_REF" | sed -nE 's|^claude/issue-([0-9]+)-.*|\1|p')
          if [ -z "$number" ]; then
            echo "::warning::Could not extract issue number from head ref: $HEAD_REF"
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark stage:failed
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "stage:failed" || true
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Self-verify job failed (infrastructure/engine error — not a verification failure). See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." || true
