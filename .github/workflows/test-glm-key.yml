name: test-glm-key
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
    steps:
      - name: Debug env key lengths
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eu
          echo "BASE_URL: $ANTHROPIC_BASE_URL"
          echo "DEEPSEEK_API_KEY len: ${#DEEPSEEK_API_KEY}"
          echo "ANTHROPIC_API_KEY len: ${#ANTHROPIC_API_KEY}"
          echo "DEEPSEEK first 8: ${DEEPSEEK_API_KEY:0:8}"
          echo "ANTHROPIC first 8: ${ANTHROPIC_API_KEY:0:8}"
          echo "DEEPSEEK last 4: ${DEEPSEEK_API_KEY: -4}"
          echo "ANTHROPIC last 4: ${ANTHROPIC_API_KEY: -4}"

      - name: Curl GLM with x-api-key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== Test 1: x-api-key header ==="
          curl -sS -o /tmp/resp1.txt -w "HTTP %{http_code}\n" -X POST \
            "${ANTHROPIC_BASE_URL}/v1/messages" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DEEPSEEK_API_KEY" \
            -d '{"model":"glm-5.2","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'
          echo "---"
          head -c 500 /tmp/resp1.txt
          echo ""

      - name: Curl GLM with Authorization Bearer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== Test 2: Authorization Bearer header ==="
          curl -sS -o /tmp/resp2.txt -w "HTTP %{http_code}\n" -X POST \
            "${ANTHROPIC_BASE_URL}/v1/messages" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d '{"model":"glm-5.2","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'
          echo "---"
          head -c 500 /tmp/resp2.txt
          echo ""

      - name: Curl GLM with no /v1 prefix
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "=== Test 3: base_url + /messages (no /v1) ==="
          curl -sS -o /tmp/resp3.txt -w "HTTP %{http_code}\n" -X POST \
            "${ANTHROPIC_BASE_URL}/messages" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DEEPSEEK_API_KEY" \
            -d '{"model":"glm-5.2","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}'
          echo "---"
          head -c 500 /tmp/resp3.txt
